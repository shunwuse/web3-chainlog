services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RPC_URL: http://anvil:8545
      DB_PATH: /data/data.db
    depends_on:
      anvil:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

volumes:
  backend-data:
